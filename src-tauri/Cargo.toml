[package]
name = "dbtables"
version = "0.1.0"
description = "A lightweight desktop database client."
authors = ["dbtables contributors"]
edition = "2021"

[lib]
name = "dbtables_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite driver for the read-only vertical slice. The `bundled` feature compiles
# a self-contained SQLite so the adapter does not depend on a system library.
rusqlite = { version = "0.40", features = ["bundled"] }
# MySQL driver for server connections. `default-features = false` selects the
# pure-Rust decompression backend (avoids a system zlib build) and `native-tls`
# provides TLS through the platform provider (SChannel on Windows).
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls"] }
# PostgreSQL driver for server connections. The asynchronous `tokio-postgres`
# client maps directly onto the adapter's async boundary and is driven by the
# application's runtime, unlike the synchronous `postgres` crate which embeds a
# private runtime and cannot be called from an async command context.
# `native-tls` provides TLS through the platform provider (SChannel on Windows),
# `postgres-types`/`bytes` support the custom text-format parameter binding, and
# `futures-util`/`tokio` drive the connection and stream results without loading
# an entire result set into memory.
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
postgres-types = "0.2"
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "sync"] }
# OS-protected credential storage for connection-profile passwords. The default
# `v1` feature selects the native store on each desktop platform: Windows
# Credential Manager, macOS Keychain, and the Linux/*BSD Secret Service. Secrets
# are never written to the plain-text settings file.
keyring = "4"
