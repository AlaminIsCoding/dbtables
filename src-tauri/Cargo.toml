[package]
name = "dbtables"
version = "0.1.0"
description = "A lightweight desktop database client."
authors = ["dbtables contributors"]
edition = "2021"

[lib]
name = "dbtables_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite driver for the read-only vertical slice. The `bundled` feature compiles
# a self-contained SQLite so the adapter does not depend on a system library.
rusqlite = { version = "0.40", features = ["bundled"] }
# MySQL driver for server connections. `default-features = false` selects the
# pure-Rust decompression backend (avoids a system zlib build) and `native-tls`
# provides TLS through the platform provider (SChannel on Windows).
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls"] }
